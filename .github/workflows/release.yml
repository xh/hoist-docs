name: Release

# Publishes everything this repo ships when a version tag (vX.Y.Z) is pushed, all at that one
# version: the tool (@xh/hoist-docs) and the TypeScript builder (@xh/hoist-docs-builder) to npm,
# the Grails builder (io.xh:hoist-docs-builder) to Maven Central, and the gateway image
# (ghcr.io/xh/hoist-docs) to GitHub Container Registry. The tag must match the version in
# package.json; builders/react/package.json and builders/core take the same version. Each npm
# package builds its dist/ through its prepack script.

on:
    push:
        tags: ['v*']

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # npm trusted publishing (OIDC): each npm package needs a trusted publisher on
            # npmjs.com naming this repo and workflow file.
            id-token: write
        env:
            NODE_AUTH_TOKEN: 'unused-outside-publish'
        steps:
            - uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/setup@v3
              with:
                  install: false
                  node-version-file: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check tag matches package.json
              run: |
                  version=$(node -p "require('./package.json').version")
                  builder=$(node -p "require('./builders/react/package.json').version")
                  [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
                  [ "$builder" = "$version" ] || { echo "builders/react/package.json version $builder does not match $version"; exit 1; }

            - name: Test
              run: pnpm test

            - name: Publish the tool
              run: pnpm publish --no-git-checks --access public

            - name: Publish the TypeScript builder
              run: pnpm publish --no-git-checks --access public
              working-directory: builders/react

            - name: Setup Java
              uses: actions/setup-java@v6.1.0
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Publish the Grails builder
              env:
                  SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
                  SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
                  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
                  SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
              run: builders/core/gradlew -p builders/core publishToSonatype closeAndReleaseSonatypeStagingRepository --no-daemon

    # The gateway image, built from the Dockerfile once the packages above are out, so a failed
    # release publishes no image. Tagged X.Y.Z, X.Y, X and latest. On its first push the package
    # is private: make it public once in the package's settings on GitHub.
    image:
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7

            - name: Setup QEMU
              uses: docker/setup-qemu-action@v3

            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags and labels
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/xh/hoist-docs
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
