name: Deploy Snapshot

# Publishes snapshots of everything this repo ships on every push to develop, so the libraries
# always build their indexes with the newest builders:
#
# - io.xh:hoist-docs-builder 1.0.0-SNAPSHOT (the Grails builder) to Sonatype's snapshot
#   repository, which hoist-core resolves.
# - @xh/hoist-docs and @xh/hoist-docs-builder to npm as `<version>.<timestamp>` (e.g.
#   1.0.0-SNAPSHOT.1794261201542) under the `next` dist-tag, which hoist-react, hoist-chat-kit and
#   Toolbox depend on.
#
# Snapshots are unsigned, so this needs only the Sonatype token. Numbered releases go through
# release.yml.

on:
    push:
        branches: [develop]
    workflow_dispatch:

# Debounce: a newer push cancels the run in progress.
concurrency:
    group: deploy-snapshot
    cancel-in-progress: true

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # npm trusted publishing (OIDC): each npm package needs a trusted publisher on
            # npmjs.com naming this repo and this workflow file.
            id-token: write
        env:
            NODE_AUTH_TOKEN: 'unused-outside-publish'
        steps:
            - uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/setup@v3
              with:
                  install: false
                  node-version-file: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'

            - name: Setup Java
              uses: actions/setup-java@v6.1.0
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test
              run: pnpm test

            # Before the npm version is set below: the Grails builder takes its version from the
            # root package.json, and must stay at the plain -SNAPSHOT version Maven expects.
            - name: Publish the Grails builder snapshot
              env:
                  SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
                  SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
              run: builders/core/gradlew -p builders/core publishToSonatype --no-daemon

            - name: Prepare snapshot version
              id: snapshot
              # Pinned to commit SHA of xh/hoist-dev-utils master, as hoist-react pins it.
              uses: xh/hoist-dev-utils/.github/actions/prepare-npm-snapshot-version@84d74ddb32d3a5114770362f9a12ce52043a48dc # master

            - name: Set the TypeScript builder to the same version
              working-directory: builders/react
              env:
                  SNAPSHOT_VERSION: ${{ steps.snapshot.outputs.snapshot-version }}
              run: npm version --no-git-tag-version "$SNAPSHOT_VERSION"

            # Always an explicit --tag: an untagged publish moves `latest`.
            - name: Publish the tool
              run: pnpm publish --no-git-checks --access public --tag next

            - name: Publish the TypeScript builder
              working-directory: builders/react
              run: pnpm publish --no-git-checks --access public --tag next

            - name: Write job summary
              continue-on-error: true
              env:
                  SNAPSHOT_VERSION: ${{ steps.snapshot.outputs.snapshot-version }}
              run: |
                  {
                    echo "### 📦 Snapshots published"
                    echo ""
                    echo "- \`@xh/hoist-docs@$SNAPSHOT_VERSION\` and \`@xh/hoist-docs-builder@$SNAPSHOT_VERSION\` (npm, \`next\`)"
                    echo "- \`io.xh:hoist-docs-builder:1.0.0-SNAPSHOT\` (Sonatype snapshots)"
                  } >> "$GITHUB_STEP_SUMMARY"
